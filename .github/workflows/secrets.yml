name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          mkdir -p .generated/gitleaks
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output .generated/gitleaks/archive.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .generated/gitleaks/archive.tar.gz' | sha256sum --check
          tar -xzf .generated/gitleaks/archive.tar.gz -C .generated/gitleaks gitleaks
      - name: Scan complete reachable history
        run: |
          .generated/gitleaks/gitleaks git --redact=100 --no-banner \
            --config .github/gitleaks.toml --gitleaks-ignore-path /dev/null \
            --ignore-gitleaks-allow --log-opts='--all --full-history' .
